name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          tmp=$(mktemp -d)
          protoc -I proto --go_out="$tmp" --go_opt=module=github.com/boson-chat/quicvoice proto/control.proto
          # Ignore the protoc version comment; only the generated code matters.
          diff <(grep -v '^// .protoc ' "$tmp/gen/controlpb/control.pb.go") \
               <(grep -v '^// .protoc ' gen/controlpb/control.pb.go)
      - name: libopus (client/voice uses cgo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopus-dev
      - run: go vet -tags nolibopusfile ./...
      - run: go test -race -tags nolibopusfile ./...
