name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generated code is up to date
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          tmp=$(mktemp -d)
          protoc -I proto --go_out="$tmp" --go_opt=module=github.com/boson-chat/quicvoice proto/control.proto
          # Ignore the protoc version comment; only the generated code matters.
          diff <(grep -v '^// .protoc ' "$tmp/gen/controlpb/control.pb.go") \
               <(grep -v '^// .protoc ' gen/controlpb/control.pb.go)
      - name: libopus (client/voice uses cgo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopus-dev
      - run: go vet -tags nolibopusfile ./...
      - run: go test -race -tags nolibopusfile ./...

  web:
    # Browser client (web/): WebTransport to quicvoiced and WebCodecs Opus,
    # in Chromium, Firefox and WebKit. A browser without WebTransport (Linux
    # WebKit) must say so, and its session tests skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - working-directory: web
        run: npm ci
      - name: Generated TypeScript is up to date
        working-directory: web
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          npm run proto
          git diff --exit-code src/gen
      - working-directory: web
        run: npx playwright install --with-deps chromium firefox webkit
      - working-directory: web
        run: npx playwright test
