# On every push to main: semantic-release reads the conventional commits since
# the last tag (feat → minor, fix/perf/refactor/build → patch). If there is a
# release, it tags vX.Y.Z, creates the GitHub release, and builds + pushes
# harbor.floret.dev/boson/quicvoice:<version> and :latest.
# ArgoCD image-updater on terra picks up the new tag and deploys it.
#
# Secrets: HARBOR_USERNAME / HARBOR_PASSWORD with push rights to the Harbor
# `boson` project (same robot account as boson-chat/boson).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  IMAGE: harbor.floret.dev/boson/quicvoice

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: libopus (client/voice uses cgo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopus-dev
      - run: go test -race -tags nolibopusfile ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.floret.dev
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@24
          -p @semantic-release/exec@6
          -p conventional-changelog-conventionalcommits@8
          semantic-release
